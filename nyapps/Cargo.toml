# ニャプリの試作。wasm32-unknown-unknown 向けにビルドし、`cargo nyapps` で .nyapp にまとめる（crates/nyapp/AGENT.md）。
[workspace]
resolver = "3"
members = ["calculator", "clock", "eyes", "sandbox"]

[workspace.package]
version = "2026.0.3-beta.3"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nyapp-sdk = { path = "../crates/nyapp-sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true
