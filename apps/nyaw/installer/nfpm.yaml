# deb、rpm、pkg.tar.zst の定義（nfpm）。linux.sh が、配布するファイルを置いたディレクトリで実行する
name: nyaw
arch: amd64
platform: linux
version: ${NYAW_PACKAGE_VERSION}
version_schema: semver
section: utils
maintainer: nekochanfood
description: VR overlay application
homepage: https://github.com/nekochanfood/nyaw
license: MIT OR Apache-2.0
umask: 0o022

contents:
  - src: ./nyaw
    dst: /usr/lib/nyaw/nyaw
    file_info:
      mode: 0755
  - src: ./libphonon.so
    dst: /usr/lib/nyaw/libphonon.so
  # アプリの更新は、実行ファイルの隣の package-format で配布形式を判別する（crates/subsystems/update の Package）
  - src: ./package-format-deb
    dst: /usr/lib/nyaw/package-format
    packager: deb
  - src: ./package-format-rpm
    dst: /usr/lib/nyaw/package-format
    packager: rpm
  - src: ./package-format-pacman
    dst: /usr/lib/nyaw/package-format
    packager: archlinux
  - src: /usr/lib/nyaw/nyaw
    dst: /usr/bin/nyaw
    type: symlink
  - src: ./nyaw.desktop
    dst: /usr/share/applications/nyaw.desktop
  - src: ./nyaw.svg
    dst: /usr/share/icons/hicolor/scalable/apps/nyaw.svg
  - src: ./LICENSE-MIT
    dst: /usr/share/doc/nyaw/LICENSE-MIT
  - src: ./LICENSE-APACHE
    dst: /usr/share/doc/nyaw/LICENSE-APACHE
  - src: ./steamaudio-THIRDPARTY.md
    dst: /usr/share/doc/nyaw/steamaudio-THIRDPARTY.md

# 直接リンクするライブラリ（PipeWire、libxkbcommon、ALSA）と、実行時に読み込むライブラリ（Vulkan のローダーと、
# エミュレーターのウィンドウが使う X11 と Wayland のライブラリ）。GPU ドライバは含めない
overrides:
  deb:
    depends:
      - libc6 (>= 2.35)
      - libstdc++6
      - libasound2t64 | libasound2
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libxkbcommon0
      - libvulkan1
      - libx11-6
      - libxcursor1
      - libwayland-client0
      - libwayland-cursor0
  # パッケージ名はディストリビューションで異なるため、ライブラリの名前で指定する
  rpm:
    depends:
      - libstdc++.so.6()(64bit)
      - libasound.so.2()(64bit)
      - libpipewire-0.3.so.0()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libvulkan.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libXcursor.so.1()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
  archlinux:
    depends:
      - gcc-libs
      - alsa-lib
      - libpipewire
      - libxkbcommon
      - vulkan-icd-loader
      - libx11
      - libxcursor
      - wayland
