[package]
name = "ui"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"

# UI 層。パネルを GPUI ウィンドウとして実体化する。
[dependencies]
# 描画は kernel::rendering が担当する。入力注入とテストには test-support フィーチャーを使用する。
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
kernel = { workspace = true, features = ["rendering-host"] }
profiler.workspace = true
design.workspace = true
i18n.workspace = true
logger.workspace = true

[dev-dependencies]
kernel = { workspace = true, features = ["novr", "test-support"] }
vr = { workspace = true, features = ["test-support", "novr"] }
testing.workspace = true
guide.workspace = true
settings.workspace = true
beam.workspace = true
wrist.workspace = true
setup.workspace = true
dashboard.workspace = true
toast.workspace = true
# ウェブサイト用のキャプチャ（tests/gpu/site.rs）が PNG で書き出す
png = "0.18"

[target.'cfg(windows)'.dev-dependencies]
# ウェブサイト用のキャプチャがパネルを高い密度で描画する（tests/gpu/site.rs）
gpui_windows = { workspace = true, features = ["test-support"] }

# 実プラットフォーム + GPU を使用する E2E テスト（tests/gpu）。GUI はメインスレッド上で動作するため独自の main を持つ。
# 各テストケースを子プロセスとして起動する。ストレステスト等は `-- --ignored` 指定時のみ実行する。
[[test]]
name = "gpu"
harness = false
