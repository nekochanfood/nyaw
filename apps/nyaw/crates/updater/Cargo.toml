[package]
name = "updater"
description = "アプリの自動更新：GitHub リリースから新しいビルドを検出し、ユーザーの承認後にインストーラーをダウンロードしてサイレント実行する"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# 通信・ダウンロード・インストーラーの起動は update サブシステム（kernel::subsystems::update）が行う
[dependencies]
gpui.workspace = true
kernel.workspace = true
logger.workspace = true
ui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# ループバックの「GitHub」（update::fake）
update = { workspace = true, features = ["test-support"] }
