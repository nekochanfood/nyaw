[package]
name = "subsystems"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 実ランタイムとエミュレーターは重い依存を伴うため、使用側が選択する（vr の同名フィーチャー）。
default = ["novr", "openvr", "openxr"]
novr = ["vr/novr"]
openvr = ["vr/openvr"]
openxr = ["vr/openxr"]
rendering-host = ["rendering/gpui"]
test-support = ["vr/test-support", "desktop/test-support"]

[dependencies]
keyboard.workspace = true
os.workspace = true
vr.workspace = true
input.workspace = true
rendering.workspace = true
desktop.workspace = true
audio.workspace = true
media.workspace = true
notifications.workspace = true
update.workspace = true
logger.workspace = true

[dev-dependencies]
vr = { workspace = true, features = ["test-support"] }
