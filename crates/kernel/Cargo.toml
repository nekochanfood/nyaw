[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

# カーネルの最下部は subsystems。設定とパネル操作を束ね、上位には kernel だけを見せる。
[features]
rendering-host = ["subsystems/rendering-host"]
# 実ランタイムとエミュレーター。既定では無効（型とモックだけで済むテストを軽くする）。起動するバイナリが選ぶ。
novr = ["subsystems/novr"]
openvr = ["subsystems/openvr"]
openxr = ["subsystems/openxr"]

[dependencies]
subsystems.workspace = true
logger.workspace = true
overlay.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
hound = "3.5"
subsystems = { workspace = true, features = ["test-support"] }
