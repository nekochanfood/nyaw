[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

# カーネルの最下部は subsystems。設定とパネル操作を束ね、上位には kernel だけを見せる。
[features]
rendering-host = ["subsystems/rendering-host"]

[dependencies]
subsystems.workspace = true
logger.workspace = true
overlay.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
subsystems = { workspace = true, features = ["test-support"] }
