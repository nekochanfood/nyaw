[package]
name = "kernel"
version.workspace = true
edition.workspace = true
license.workspace = true

# subsystems を最下層とし、設定とパネル操作を統合して上位には kernel のみを公開する
[features]
rendering-host = ["subsystems/rendering-host"]
test-support = ["subsystems/test-support"]
# VR 実ランタイムおよびエミュレーター。既定では無効化し、型とモックのみで完結するテストを高速に保つ。有効化はバイナリ側で選択する
novr = ["subsystems/novr"]
openvr = ["subsystems/openvr"]
openxr = ["subsystems/openxr"]

[dependencies]
subsystems.workspace = true
logger.workspace = true
overlay.workspace = true
serde = { version = "1", features = ["derive"] }
toml = "0.9"

[dev-dependencies]
hound = "3.5"
subsystems = { workspace = true, features = ["test-support"] }
