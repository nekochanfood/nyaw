[package]
name = "webui"
version.workspace = true
edition.workspace = true

# UI 層（GPUI）と同格の Web フロントエンド。Tauri の WebView をオーバーレイのパネルにする。
[dependencies]
kernel.workspace = true
logger.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.12"

# WebView を画面に出さずに撮る（capture.rs）。tauri が使うものと同じ版に合わせる。
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2", features = ["v2_40"] }
cairo-rs = "0.18"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }
png = "0.17"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
vr = { workspace = true, features = ["test-support"] }
webtesting.workspace = true
logger.workspace = true

# 実プラットフォームの WebView で、レーザー・マウスから JS のポインタイベントまでを確かめる。
# Tauri はメインスレッドでイベントループを回すので独自 main。
[[test]]
name = "webview_vr"
harness = false

[[test]]
name = "webview_novr"
harness = false

# ポインタの方式（マウス / タッチのエミュレート）を webtesting の pointer.html で確かめる。
[[test]]
name = "webview_pointer"
harness = false
