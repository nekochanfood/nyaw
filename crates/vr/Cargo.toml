[package]
name = "vr"
version.workspace = true
edition.workspace = true

[dependencies]
glam.workspace = true
logger.workspace = true
os.workspace = true
# OpenVR の C API。ビルド時に cmake と C++ コンパイラで openvr_api を静的リンクする
openvr_bindings = "2.1.1"
# OpenXR。ローダーは cmake でビルドして静的リンクする（DLL を同梱しなくて済む）
openxr = { version = "0.22", default-features = false, features = ["static"] }
# OpenXR のスワップチェーンへ画像を書き込むための Vulkan
ash = "0.38"
# SteamVR の vrclient を実行時に読み込む
libloading = "0.8"
# novr のエミュレーターのウィンドウ
minifb = "0.29.0"
# novr のエミュレーターの GPU コンポジタ（compositor.rs）
wgpu = "29.0.4"
pollster = "0.4"
raw-window-handle = "0.6"

[features]
# 上位層のテスト用モック (vr::mock) を公開する
test-support = []
