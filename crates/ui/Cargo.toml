[package]
name = "ui"
version.workspace = true
edition.workspace = true

[dependencies]
# test-support は Window::render_to_image（オフスクリーン描画の読み戻し）のために本番でも必要。
# 上流で一般公開されたら外す。
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
kernel.workspace = true
logger.workspace = true

# 実プラットフォーム + GPU で描画を読み戻す。GUI はメインスレッドで回すため独自 main。
[[test]]
name = "gpu_capture"
harness = false
