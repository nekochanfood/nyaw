[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# UI 層。パネルを GPUI のウィンドウか Tauri の WebView（web モジュール）で実体化する。
[dependencies]
# 描画は kernel::rendering が担う。UI の入力注入とテストにも test-support を使う。
gpui = { workspace = true, features = ["test-support"] }
# x11 / wayland: Linux で実ウィンドウを開く（無いとヘッドレスになる）。
gpui_platform = { workspace = true, features = ["test-support", "x11", "wayland"] }
kernel = { workspace = true, features = ["rendering-host"] }
profiler.workspace = true
logger.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = "2.12"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
vr = { workspace = true, features = ["test-support"] }
webpages.workspace = true
testing.workspace = true
beam.workspace = true

# 実プラットフォーム + GPU で描画を読み戻す。GUI はメインスレッドで回すため独自 main。
[[test]]
name = "gpu_capture"
harness = false

[[test]]
name = "panel_lod"
harness = false

# 実プラットフォームの GPUI + Tauri（WebView）で、レーザー・マウスから JS のポインタイベントまでを確かめる。
[[test]]
name = "web_vr"
harness = false

[[test]]
name = "web_novr"
harness = false

[[test]]
name = "web_pointer"
harness = false

# ベンチマーク。常には流さない（`-- --ignored` のときだけ）。
[[test]]
name = "stress"
harness = false

# novr（エミュレーター）でのポインタの見た目（長押しのリング）を実際の GPU で確かめる。
[[test]]
name = "novr_cursor"
harness = false
# テスト用パネル（毎フレーム描き直すパネル・開けるパネルの数の上限）を本番のフレームループで確かめる。
[[test]]
name = "test_panels"
harness = false
