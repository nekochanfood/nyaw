[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# UI 層。パネルを GPUI のウィンドウで実体化する。
[dependencies]
# 描画は kernel::rendering が担う。UI の入力注入とテストにも test-support を使う。
gpui = { workspace = true, features = ["test-support"] }
# x11 / wayland: Linux で実ウィンドウを開く（無いとヘッドレスになる）。
gpui_platform = { workspace = true, features = ["test-support", "x11", "wayland"] }
kernel = { workspace = true, features = ["rendering-host"] }
profiler.workspace = true
design.workspace = true
logger.workspace = true

[dev-dependencies]
kernel = { workspace = true, features = ["novr"] }
vr = { workspace = true, features = ["test-support", "novr"] }
testing.workspace = true
beam.workspace = true

# 実プラットフォーム + GPU で描画を読み戻す。GUI はメインスレッドで回すため独自 main。
[[test]]
name = "gpu_capture"
harness = false

[[test]]
name = "panel_lod"
harness = false

# ベンチマーク。常には流さない（`-- --ignored` のときだけ）。
[[test]]
name = "stress"
harness = false

# novr（エミュレーター）でのポインタの見た目（長押しのリング）を実際の GPU で確かめる。
[[test]]
name = "novr_cursor"
harness = false
# テスト用パネル（毎フレーム描き直すパネル・開けるパネルの数の上限）を本番のフレームループで確かめる。
[[test]]
name = "test_panels"
harness = false
