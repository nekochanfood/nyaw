[package]
name = "ui"
version.workspace = true
edition.workspace = true
license.workspace = true

# UI 層。パネルを GPUI のウィンドウで実体化する。
[dependencies]
# 描画は kernel::rendering が担う。UI の入力注入とテストにも test-support を使う。
gpui = { workspace = true, features = ["test-support"] }
gpui_platform = { workspace = true, features = ["test-support"] }
kernel = { workspace = true, features = ["rendering-host"] }
profiler.workspace = true
design.workspace = true
i18n.workspace = true
logger.workspace = true

[dev-dependencies]
kernel = { workspace = true, features = ["novr", "test-support"] }
vr = { workspace = true, features = ["test-support", "novr"] }
testing.workspace = true
beam.workspace = true

# 実プラットフォーム + GPU で動かすテスト（tests/gpu）。GUI はメインスレッドで回すため独自 main。
# ケースごとに子プロセスで起こす。ストレステスト（ベンチマーク）などは `-- --ignored` のときだけ流す。
[[test]]
name = "gpu"
harness = false
