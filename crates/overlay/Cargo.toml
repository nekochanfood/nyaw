[package]
name = "overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 起動済みの SteamVR が要るテスト（animation_runtime）用。
openvr = ["subsystems/openvr"]

[[test]]
name = "animation_runtime"
required-features = ["openvr"]

[dependencies]
subsystems.workspace = true
logger.workspace = true
# 値（design）と動き（animation）だけを使う（GPUI は持ち込まない）
animation.workspace = true
design = { path = "../design", default-features = false }

[dev-dependencies]
subsystems = { workspace = true, features = ["test-support"] }
