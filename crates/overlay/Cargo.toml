[package]
name = "overlay"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 起動済みの SteamVR が要るテスト（animation_runtime）用。
openvr = ["subsystems/openvr"]

[[test]]
name = "animation_runtime"
required-features = ["openvr"]

[dependencies]
subsystems.workspace = true
logger.workspace = true
animato = { version = "1.7.2", default-features = false, features = ["tween"] }

[dev-dependencies]
subsystems = { workspace = true, features = ["test-support"] }
