[package]
name = "testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Development only. Production crates must reference this only via dev-dependencies.
[dependencies]
gpui = { workspace = true, features = ["test-support"] }
# 下位の型はカーネルの再エクスポート（kernel::vr / kernel::subsystems::input）経由で見る
kernel = { workspace = true, features = ["novr", "openvr", "openxr", "test-support"] }
ui.workspace = true
# NYAW_E2E_WATCH shows rendering during tests in an OS window (watch.rs)
minifb = "0.29.0"
logger.workspace = true
serde_json = "1"
# One in-process process snapshot instead of spawning tasklist/taskkill per name (cleanup polls fast)
sysinfo = { version = "0.31", default-features = false, features = ["system"] }

# The screens the scenarios operate. The kit itself knows nothing about screens
[dev-dependencies]
testing.workspace = true
kernel = { workspace = true, features = ["test-support"] }
wrist.workspace = true

# E2E on real runtimes. The launched runtime reads environment variables, so run it from a single-threaded custom main
[[test]]
name = "runtimes"
harness = false
