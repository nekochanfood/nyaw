[package]
name = "rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
gpui = ["dep:gpui", "dep:raw-window-handle", "dep:windows", "dep:gpui_windows"]

[dependencies]
vr.workspace = true
logger.workspace = true
# render_to_image が一般公開されたら test-support を外す。
gpui = { workspace = true, features = ["test-support"], optional = true }
raw-window-handle = { version = "0.6", optional = true }

[target.'cfg(windows)'.dependencies]
gpui_windows = { workspace = true, features = ["test-support"], optional = true }
windows = { optional = true, version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
vr = { workspace = true, features = ["test-support"] }
