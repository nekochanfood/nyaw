[package]
name = "rendering"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
gpui = [
    "dep:gpui",
    "dep:gpui_platform",
    "dep:gpui_windows",
    "dep:gpui_wgpu",
    "dep:image",
    "dep:raw-window-handle",
    "dep:futures",
    "dep:anyhow",
]

[dependencies]
vr.workspace = true
logger.workspace = true
# render_to_image が一般公開されたら test-support を除去する。
gpui = { workspace = true, features = ["test-support"], optional = true }
# RGBA の画素を GPUI の画像に変換する（`gpui::render_image`）。gpui と同じ版に同期するのはこの箇所のみ。
image = { version = "0.25", default-features = false, optional = true }

# パネルを描画する GPUI アプリケーションのプラットフォーム（`gpui::application`）。
gpui_platform = { workspace = true, features = ["test-support"], optional = true }

[target.'cfg(windows)'.dependencies]
gpui_windows = { workspace = true, features = ["test-support"], optional = true }

# Linux はパネルを表示サーバーに作らず、wgpu のオフスクリーン描画先に描く（src/gpui/linux.rs）。
[target.'cfg(target_os = "linux")'.dependencies]
# font-kit は書体の太さ・字形の照合（表示サーバーありの gpui_linux と同じ）。
gpui_wgpu = { workspace = true, features = ["test-support", "font-kit"], optional = true }
raw-window-handle = { version = "0.6", optional = true }
futures = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }

[dev-dependencies]
vr = { workspace = true, features = ["test-support"] }
