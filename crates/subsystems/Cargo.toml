[package]
name = "subsystems"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# 実ランタイムとエミュレーターは重い依存を引くので、使う側が選ぶ（vr の同名フィーチャー）。
default = ["novr", "openvr", "openxr"]
novr = ["vr/novr"]
openvr = ["vr/openvr"]
openxr = ["vr/openxr"]
rendering-host = ["rendering/gpui"]
test-support = ["vr/test-support"]

[dependencies]
os.workspace = true
vr.workspace = true
input.workspace = true
rendering.workspace = true
logger.workspace = true

[dev-dependencies]
vr = { workspace = true, features = ["test-support"] }
