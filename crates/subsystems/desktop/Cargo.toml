[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", default-features = false, features = ["async-io", "screencast", "remote_desktop"] }
pipewire = "0.10.1"
futures-lite = "2.6"
async-io = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_Com", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Controls", "Win32_UI_Input_Pointer", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
] }
