[package]
name = "desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
# 表示サーバーの画像をランタイムの GPU へ直接渡す型（vr::ExternalImage）。
vr.workspace = true
os.workspace = true
logger.workspace = true

# Linux の取り込みと入力注入。表示サーバーごとに X11（XSHM / XTest）、wlroots（wlr-screencopy / 仮想ポインタ）、
# その他の Wayland（xdg-desktop-portal の ScreenCast・RemoteDesktop と PipeWire）を使い分ける（src/linux/）。
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", features = ["shm", "randr", "xfixes", "xtest", "damage"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screencast", "remote_desktop"] }
pollster = "0.4"
pipewire = { version = "0.9", features = ["v0_3_65"] }
rustix = { version = "1", features = ["fs", "mm", "event", "param", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Foundation", "Graphics_Capture", "Graphics_DirectX_Direct3D11", "Win32_Devices_Display",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi",
    "Win32_System_Com", "Win32_System_Performance", "Win32_System_Threading", "Win32_System_WinRT_Direct3D11", "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    # インストール済みアプリ（shell:AppsFolder）の名前・ID・実行ファイル・アイコンの取得に使用
    "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage",
] }
