[workspace]
members = [
    "crates/*",
    "crates/subsystems/os",
    "crates/subsystems/vr",
    "crates/subsystems/input",
    "crates/subsystems/rendering",
    "crates/subsystems/keyboard",
    "crates/subsystems/desktop",
    "crates/subsystems/audio",
    "crates/subsystems/media",
]
# vendor/ は手を入れた zed のクレートの写し（それぞれの Cargo.toml）。ワークスペースには入れない
# nyapps/ は wasm 向けにビルドするニャプリの試作（別のワークスペース。crates/nyapp/AGENT.md）
exclude = ["vendor", "nyapps"]

[workspace.package]
version = "2026.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
glam = "0.30"
log = "0.4"
# crates.io 版 (0.2.2) は Window::dispatch_event の戻り値型が非公開で外部から入力を注入できないため git 版に固定
gpui = { git = "https://github.com/zed-industries/zed", rev = "26363aabdb31a0c016728634202e1ad5067033aa" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "26363aabdb31a0c016728634202e1ad5067033aa" }
gpui_windows = { git = "https://github.com/zed-industries/zed", rev = "26363aabdb31a0c016728634202e1ad5067033aa" }
gpui_linux = { git = "https://github.com/zed-industries/zed", rev = "26363aabdb31a0c016728634202e1ad5067033aa" }
gpui_wgpu = { git = "https://github.com/zed-industries/zed", rev = "26363aabdb31a0c016728634202e1ad5067033aa" }
logger = { path = "crates/logger" }
os = { path = "crates/subsystems/os" }
rendering = { path = "crates/subsystems/rendering" }
keyboard = { path = "crates/subsystems/keyboard" }
desktop = { path = "crates/subsystems/desktop" }
audio = { path = "crates/subsystems/audio" }
media = { path = "crates/subsystems/media" }
kernel = { path = "crates/kernel", default-features = false }
subsystems = { path = "crates/subsystems", default-features = false }
vr = { path = "crates/subsystems/vr", default-features = false }
input = { path = "crates/subsystems/input" }
overlay = { path = "crates/overlay" }
ui = { path = "crates/ui" }
design = { path = "crates/design" }
i18n = { path = "crates/i18n" }
profiler = { path = "crates/profiler" }
testing = { path = "crates/testing" }
wrist = { path = "crates/wrist" }
dashboard = { path = "crates/dashboard" }
beam = { path = "crates/beam" }
nyapp = { path = "crates/nyapp" }
nyapp-sdk = { path = "crates/nyapp-sdk" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[package]
name = "nyaw"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
logger.workspace = true
kernel = { workspace = true, features = ["novr", "openvr", "openxr"] }
ui.workspace = true
profiler.workspace = true
wrist.workspace = true
testing.workspace = true
beam.workspace = true

# testkit の CPU ラスタライザは毎フレーム全画素を塗るので、デバッグビルドでも最適化する
[profile.dev.package.testkit]
opt-level = 2

# novr のエミュレーターは毎フレーム全画素を CPU で合成するので、デバッグビルドでも最適化する
[profile.dev.package.vr]
opt-level = 2

# 配信は毎フレーム全画素を CPU で並べ替えるので、デバッグビルドでも最適化する
[profile.dev.package.desktop]
opt-level = 2

# プロファイラは計測する側なので、その描画で計測を重くしないよう最適化する
[profile.dev.package.profiler]
opt-level = 2

# gpui（Windows）はデバッグアサーションが有効だと、ウィンドウを作るたびに HLSL を最適化なしで実行時にコンパイルする
# （1 枚 180ms 前後止まり、描画も遅いシェーダーになる）。ビルド時にコンパイル済みのシェーダーを使わせる。
[profile.dev.package.gpui_windows]
debug-assertions = false

# 依存（gpui 等）は未最適化だと描画が桁違いに遅く、プロファイラ窓の描画だけで 1 フレーム 50ms を超えてフレームを落とす。
# 自前クレートはデバッグしやすいよう最適化しない。
[profile.dev.package."*"]
opt-level = 2

# Windows の GPUI の読み戻しを GPU の完了を待たないものにする（vendor/gpui_windows/Cargo.toml）
[patch."https://github.com/zed-industries/zed"]
gpui_windows = { path = "vendor/gpui_windows" }
# Linux の GPUI を窓を出さずに描き、読み戻せるようにする（vendor/gpui_linux, vendor/gpui_wgpu）
gpui_linux = { path = "vendor/gpui_linux" }
gpui_wgpu = { path = "vendor/gpui_wgpu" }
