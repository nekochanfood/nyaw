name: nyaw Release

# 配布物（Windows のインストーラーと Linux の各形式のパッケージ）をビルドしてリリースアセットを添付するワークフロー。
# plan で内容を決め、windows と linux でビルドし、両方が揃った場合に限り publish で公開する。
# 以下のトリガーに対応する:
# 1. main ブランチへのマージ（Prepare release によるバージョン更新 PR のマージ時）:
#    PR ブランチ側で事前ビルドされた成果物を再利用し、v<バージョン> の正式リリースを作成・添付する。
# 2. 手動実行（workflow_dispatch）によるプレリリース発行:
#    チャネル名（alpha, beta 等）を指定して実行した場合、v<バージョン>-<チャネル名>.<連番> のプレリリースを発行する。
# 3. 手動実行（引数なし）による配布物の事前生成:
#    対象ブランチの配布物をビルドし、アーティファクトとして保存する（Prepare release からの呼び出し用）。
# 4. 手動で公開（published）されたリリースに対するアセット添付。
on:
  release:
    types: [published]
  push:
    branches: [main]
    # 配布物の内容に関わる変更だけで実行する（版上げの PR は apps/nyaw/Cargo.toml を変える）
    paths: [apps/nyaw/**, assets/**, .github/workflows/release.yml, .github/workflows/linux.yml]
  # チャネル名を指定して実行するとプレリリースを発行する。空欄の場合は配布物のビルド・アーティファクト保存のみを行う
  workflow_dispatch:
    inputs:
      prerelease:
        description: プレリリースのチャネル名（alpha, beta 等。連番は自動付与）。空欄の場合は配布物の事前ビルドのみ実行
        required: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # PR ブランチで生成された成果物の検索
      actions: read
      pull-requests: read
    outputs:
      tag: ${{ steps.outputs.outputs.tag }}
      # タグから先頭の v を除いた値。成果物のファイル名と、アーティファクト名に使う
      version: ${{ steps.outputs.outputs.version }}
      prev: ${{ steps.outputs.outputs.prev }}
      build: ${{ steps.outputs.outputs.build }}
      publish: ${{ steps.outputs.outputs.publish }}
      reuse-run: ${{ steps.outputs.outputs.reuse-run }}
    defaults:
      run:
        shell: bash
        # アプリのディレクトリ。uses: のステップには効かないため、パスはリポジトリのルートから指定する
        working-directory: apps/nyaw
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # ビルド番号（HEAD までの通算コミット数）の比較と、タグの検索に全履歴を使う
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # リリース対象タグ（TAG）、ビルド実行フラグ（BUILD）、およびリリース発行フラグ（PUBLISH）の決定
      - name: Decide the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          BEFORE: ${{ github.event.before || 'origin/main' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
            echo "BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "BUILD=1" >> "$GITHUB_ENV"
          else
            BEFORE=$(git merge-base HEAD "$BEFORE")
          fi
          ver() { sed -n 's/^version = "\([^"]*\)".*/\1/p'; }
          new=$(ver < Cargo.toml)
          # 変更履歴の起点。安定版は前の安定版からとし、間のプレリリースで入った変更も含める
          stable=()
          if [ -z "$PRERELEASE" ] && [[ $new != *-* ]]; then
            stable=(--exclude '*-*')
          fi
          if prev=$(git describe --tags --abbrev=0 "${stable[@]}" "$BEFORE" 2> /dev/null); then
            echo "PREV=$prev" >> "$GITHUB_ENV"
          fi
          if [ -n "$PRERELEASE" ]; then
            if [[ $new == *-* ]]; then
              echo "::error::the version $new already has a label; run this on the version-bump PR's branch"
              exit 1
            fi
            n=$(git tag -l "v$new-$PRERELEASE.*" | sed 's/.*\.//' | sort -n | tail -1)
            echo "TAG=v$new-$PRERELEASE.$((n + 1))" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
            echo "BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          old=$(git show "$BEFORE:./Cargo.toml" | ver) || true
          [ -n "$old" ] && [ "$new" != "$old" ] && [[ $new != *-dev.* ]] || exit 0
          at=$(git ls-remote --tags origin "refs/tags/v$new" | cut -f1)
          if [ -n "$at" ] && [ "$at" != "$(git rev-parse HEAD)" ]; then
            echo "::error::v$new is already tagged at $at"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          fi
          echo "TAG=v$new" >> "$GITHUB_ENV"
          echo "BUILD=1" >> "$GITHUB_ENV"
      # タグ形式の検証（v<CalVer>[-<チャネル名>.<番号>]）と各パッケージバージョンとの整合性チェック
      - name: Check tag matches Cargo.toml versions
        if: env.TAG != ''
        run: |
          set -o pipefail
          re='^v?[0-9]{4}\.[0-9]+\.[0-9]+(-[^<>:"|?*/\[:space:]]+\.[0-9]+)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag $TAG is not v<CalVer>[-<label>.<number>] (e.g. v2026.0.1-beta.1)"
            exit 1
          fi
          pkgs=$(cargo metadata --no-deps --format-version 1 |
            grep -o '"name":"[^"]*","version":"[^"]*"')
          if [ -z "$pkgs" ]; then
            echo "::error::could not read package versions from cargo metadata"
            exit 1
          fi
          base=$(sed -E 's/-.+\.[0-9]+$//' <<<"${TAG#v}")
          bad=$(grep -v -e "\"version\":\"${TAG#v}\"" -e "\"version\":\"$base\"" <<<"$pkgs" || true)
          if [ -n "$bad" ]; then
            echo "::error::tag $TAG does not match these package versions: $bad"
            exit 1
          fi
      # PR ブランチ側で先行ビルドされた成果物の再利用（同一コミット・同一ツリーの場合のみ採用）。
      # アーティファクト名はバージョンを含むため、同じコミットから発行したプレリリースの成果物は選ばれない
      - name: Reuse the artifacts built in the PR
        if: env.PUBLISH == '1' && !inputs.prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[0].number')
            git fetch -q origin "refs/pull/$pr/head"
            head=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$head^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ] ||
              [ "$(git rev-list --count "$head")" != "$(git rev-list --count HEAD)" ]; then
              echo "::notice::PR #$pr ($head) is not what landed on main; building again"
              exit 0
            fi
          fi
          for run in $(gh run list -w release.yml -c "$head" -s success --json databaseId -q '.[].databaseId'); do
            names=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" -q '.artifacts[] | select(.expired | not) | .name')
            found=0
            for name in installer linux-packages-{debian,fedora,arch}; do
              grep -qxF "$name-${TAG#v}" <<<"$names" && found=$((found + 1))
            done
            if [ "$found" = 4 ]; then
              echo "::notice::reusing the artifacts built by run $run for $head"
              echo "REUSE_RUN=$run" >> "$GITHUB_ENV"
              break
            fi
          done
      - id: outputs
        run: |
          {
            echo "tag=${TAG:-}"
            echo "version=${TAG:+${TAG#v}}"
            echo "prev=${PREV:-}"
            echo "build=${BUILD:-}"
            echo "publish=${PUBLISH:-}"
            echo "reuse-run=${REUSE_RUN:-}"
          } >> "$GITHUB_OUTPUT"

  windows:
    needs: plan
    if: needs.plan.outputs.build == '1' && needs.plan.outputs.reuse-run == ''
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      NYAW_VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: apps/nyaw
    steps:
      - uses: actions/checkout@v4
        with:
          # 依存クレートの build.rs からトークンを遮断するため資格情報を破棄
          persist-credentials: false
          # ビルド番号（HEAD までの通算コミット数）を算出するため全履歴を取得
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nyaw
          # キャッシュ保存は main ブランチに限定
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # タグがない場合の目的はキャッシュの作成だけであるため、キャッシュヒット時はビルドを省略する。
      # ライセンス一覧生成のため、開発用依存パッケージを含む全ソースをオフラインビルド前に先行フェッチする
      - if: env.TAG != '' || steps.cache.outputs.cache-hit != 'true'
        run: |
          cargo fetch --locked
          cargo build --release
      # Inno Setup コンパイラ（iscc）の環境確認とセットアップ
      - if: env.TAG != ''
        run: command -v iscc || choco install innosetup -y --no-progress
      - if: env.TAG != ''
        run: iscc installer/nyaw.iss
      - if: env.TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ needs.plan.outputs.version }}
          path: apps/nyaw/target/installer/*.exe
          if-no-files-found: error

  linux:
    needs: plan
    if: needs.plan.outputs.build == '1' && needs.plan.outputs.reuse-run == ''
    permissions:
      contents: read
    uses: ./.github/workflows/linux.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      cache-only: ${{ needs.plan.outputs.tag == '' }}

  publish:
    needs: [plan, windows, linux]
    # 成果物を再利用する場合は、ビルドのジョブは実行されない（skipped）
    if: >-
      !cancelled() && needs.plan.outputs.publish == '1' &&
      (needs.plan.outputs.reuse-run != '' || (needs.windows.result == 'success' && needs.linux.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      # リリースの作成と、リリース後のバージョン進行ワークフローの起動
      contents: write
      actions: write
    env:
      TAG: ${{ needs.plan.outputs.tag }}
      VERSION: ${{ needs.plan.outputs.version }}
      PREV: ${{ needs.plan.outputs.prev }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # ビルド番号（HEAD までの通算コミット数）を算出するため全履歴を取得
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: installer-${{ needs.plan.outputs.version }}
          path: dist
          run-id: ${{ needs.plan.outputs.reuse-run || github.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          # ディストリビューションごとのビルドの成果物をまとめて取得する
          pattern: linux-packages-*-${{ needs.plan.outputs.version }}
          merge-multiple: true
          path: dist
          run-id: ${{ needs.plan.outputs.reuse-run || github.run_id }}
          github-token: ${{ github.token }}
      # 一部の配布物だけのリリースを作らないよう、作成の前にすべての存在を確認する
      - run: |
          assets=("nyaw-$VERSION-setup.exe" "nyaw-$VERSION-amd64.deb")
          for suffix in AppImage AppImage.zsync tar.gz rpm pkg.tar.zst; do
            assets+=("nyaw-$VERSION-x86_64.$suffix")
          done
          (cd dist && ls -l "${assets[@]}")
          printf 'dist/%s\n' "${assets[@]}" > assets.txt
      # GitHub Releases の作成（プレリリースまたは正式リリース）
      - run: |
          pre=
          if [[ $TAG == *-* ]]; then
            pre=--prerelease
          fi
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" $pre --generate-notes ${PREV:+--notes-start-tag "$PREV"}
        env:
          GH_TOKEN: ${{ github.token }}
      # リリースノート末尾へ不可視のビルド番号注釈（<!-- nyaw-build: <番号> -->）を付加
      - run: |
          build=$(git rev-list --count HEAD)
          gh release view "$TAG" --json body -q .body | sed '/^<!-- nyaw-build: [0-9]* -->$/d' > notes.md
          { echo; echo "<!-- nyaw-build: $build -->"; } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - run: |
          mapfile -t assets < assets.txt
          gh release upload "$TAG" "${assets[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # 正式リリース発行後、main ブランチを次期バージョン（-dev.0）へ自動進行させるため Prepare release をトリガー
      - if: github.event_name == 'push'
        run: |
          v=${TAG#v}
          next=${v%%-*}
          [ "$v" != "$next" ] || next=${next%.*}.$((${next##*.} + 1))
          gh workflow run prepare-release.yml --ref main -f version="$next-dev.0"
        env:
          GH_TOKEN: ${{ github.token }}
