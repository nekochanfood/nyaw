name: Release

# リリースを公開すると、インストーラをビルドしてそのリリースに添付する
# （GITHUB_TOKEN で作ったリリースではワークフローが発火しないので、画面か自分の gh で作る）
on:
  release:
    types: [published]

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.release.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # インストーラは Cargo.toml のバージョンを使う。本体と nyapps（別のワークスペース）の全パッケージが
      # タグ（v 付きでもよい）と同じでなければビルド前に止める
      - name: Check tag matches Cargo.toml versions
        run: |
          set -o pipefail
          pkgs=$(for m in Cargo.toml nyapps/Cargo.toml; do
            cargo metadata --manifest-path "$m" --no-deps --format-version 1 |
              grep -o '"name":"[^"]*","version":"[^"]*"'
          done)
          # 1 件も拾えないのは metadata の形が変わったとき。素通りさせない
          if [ -z "$pkgs" ]; then
            echo "::error::could not read package versions from cargo metadata"
            exit 1
          fi
          bad=$(grep -v "\"version\":\"${TAG#v}\"" <<<"$pkgs" || true)
          if [ -n "$bad" ]; then
            echo "::error::tag $TAG does not match these package versions: $bad"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          # タグのスコープに保存しても次のタグからは読めない
          save-if: false
      - run: cargo build --release
      # ランナーに Inno Setup が無いイメージでも動くように
      - run: command -v iscc || choco install innosetup -y --no-progress
      - run: iscc installer/nyaw.iss
      - run: gh release upload "$TAG" target/installer/*.exe --clobber
