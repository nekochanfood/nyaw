name: Release

# インストーラーをビルドしてリリースアセットを添付するワークフロー。
# 以下のトリガーに対応する:
# 1. main ブランチへのマージ（Prepare release によるバージョン更新 PR のマージ時）:
#    PR ブランチ側で事前ビルドされたインストーラー成果物を再利用し、v<バージョン> の正式リリースを作成・添付する。
# 2. 手動実行（workflow_dispatch）によるプレリリース発行:
#    チャネル名（alpha, beta 等）を指定して実行した場合、v<バージョン>-<チャネル名>.<連番> のプレリリースを発行する。
# 3. 手動実行（引数なし）によるインストーラーの事前生成:
#    対象ブランチのインストーラーをビルドし、アーティファクトとして保存する（Prepare release からの呼び出し用）。
# 4. 手動で公開（published）されたリリースに対するアセット添付。
on:
  release:
    types: [published]
  push:
    branches: [main]
  # チャネル名を指定して実行するとプレリリースを発行する。空欄の場合はインストーラーのビルド・アーティファクト保存のみを行う
  workflow_dispatch:
    inputs:
      prerelease:
        description: プレリリースのチャネル名（alpha, beta 等。連番は自動付与）。空欄の場合はインストーラーの事前ビルドのみ実行
        required: false

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
      # PR ブランチで生成されたインストーラーの取得、およびリリース後のバージョン進行ワークフロー起動用権限
      actions: write
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # 依存クレートの build.rs から書き込み権限付きトークンを遮断するため資格情報を破棄
          persist-credentials: false
          # ビルド番号（HEAD までの通算コミット数）を算出するため全履歴を取得
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # リリース対象タグ（TAG）、ビルド実行フラグ（BUILD）、およびリリース発行フラグ（PUBLISH）の決定
      - name: Decide the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ inputs.prerelease }}
          BEFORE: ${{ github.event.before || 'origin/main' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
            echo "BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "BUILD=1" >> "$GITHUB_ENV"
          else
            BEFORE=$(git merge-base HEAD "$BEFORE")
          fi
          if prev=$(git describe --tags --abbrev=0 "$BEFORE" 2> /dev/null); then
            echo "PREV=$prev" >> "$GITHUB_ENV"
          fi
          ver() { sed -n 's/^version = "\([^"]*\)".*/\1/p'; }
          new=$(ver < Cargo.toml)
          if [ -n "$PRERELEASE" ]; then
            if [[ $new == *-* ]]; then
              echo "::error::the version $new already has a label; run this on the version-bump PR's branch"
              exit 1
            fi
            n=$(git tag -l "v$new-$PRERELEASE.*" | sed 's/.*\.//' | sort -n | tail -1)
            echo "TAG=v$new-$PRERELEASE.$((n + 1))" >> "$GITHUB_ENV"
            echo "PUBLISH=1" >> "$GITHUB_ENV"
            echo "BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          old=$(git show "$BEFORE:Cargo.toml" | ver) || true
          [ -n "$old" ] && [ "$new" != "$old" ] && [[ $new != *-dev.* ]] || exit 0
          at=$(git ls-remote --tags origin "refs/tags/v$new" | cut -f1)
          if [ -n "$at" ] && [ "$at" != "$(git rev-parse HEAD)" ]; then
            echo "::error::v$new is already tagged at $at"
            exit 1
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "PUBLISH=1" >> "$GITHUB_ENV"
          fi
          echo "TAG=v$new" >> "$GITHUB_ENV"
          echo "BUILD=1" >> "$GITHUB_ENV"
      # タグ形式の検証（v<CalVer>[-<チャネル名>.<番号>]）と各パッケージバージョンとの整合性チェック
      - name: Check tag matches Cargo.toml versions
        if: env.TAG != ''
        run: |
          set -o pipefail
          re='^v?[0-9]{4}\.[0-9]+\.[0-9]+(-[^<>:"|?*/\[:space:]]+\.[0-9]+)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag $TAG is not v<CalVer>[-<label>.<number>] (e.g. v2026.0.1-beta.1)"
            exit 1
          fi
          pkgs=$(cargo metadata --no-deps --format-version 1 |
            grep -o '"name":"[^"]*","version":"[^"]*"')
          if [ -z "$pkgs" ]; then
            echo "::error::could not read package versions from cargo metadata"
            exit 1
          fi
          base=$(sed -E 's/-.+\.[0-9]+$//' <<<"${TAG#v}")
          bad=$(grep -v -e "\"version\":\"${TAG#v}\"" -e "\"version\":\"$base\"" <<<"$pkgs" || true)
          if [ -n "$bad" ]; then
            echo "::error::tag $TAG does not match these package versions: $bad"
            exit 1
          fi
          echo "NYAW_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # PR ブランチ側で先行ビルドされたインストーラー成果物の再利用（同一コミット・同一ツリーの場合のみ採用）
      - name: Reuse the installer built in the PR
        if: env.PUBLISH == '1' && !inputs.prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[0].number')
            git fetch -q origin "refs/pull/$pr/head"
            head=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$head^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ] ||
              [ "$(git rev-list --count "$head")" != "$(git rev-list --count HEAD)" ]; then
              echo "::notice::PR #$pr ($head) is not what landed on main; building again"
              exit 0
            fi
          fi
          for run in $(gh run list -w release.yml -c "$head" -s success --json databaseId -q '.[].databaseId'); do
            gh run download "$run" -n installer -D pr-installer && break
          done
          mkdir -p target/installer
          mv "pr-installer/nyaw-${TAG#v}-setup.exe" target/installer/
          echo "::notice::reusing the installer built by run $run for $head"
          echo "BUILD=" >> "$GITHUB_ENV"
      - if: env.BUILD == '1'
        id: cache
        uses: Swatinem/rust-cache@v2
        with:
          # キャッシュ保存は main ブランチに限定
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # キャッシュヒット時は不要な再ビルドをスキップ
      - if: env.BUILD == '1' && env.TAG == '' && steps.cache.outputs.cache-hit == 'true'
        run: echo "BUILD=" >> "$GITHUB_ENV"
      # ライセンス一覧生成のため、開発用依存パッケージを含む全ソースをオフラインビルド前に先行フェッチ
      - if: env.BUILD == '1'
        run: cargo fetch --locked
      - if: env.BUILD == '1'
        run: cargo build --release
      # Inno Setup コンパイラ（iscc）の環境確認とセットアップ
      - if: env.BUILD == '1' && env.TAG != ''
        run: command -v iscc || choco install innosetup -y --no-progress
      - if: env.BUILD == '1' && env.TAG != ''
        run: iscc installer/nyaw.iss
      # PR ブランチ実行時は生成されたインストーラーをアーティファクトとして保存
      - if: env.TAG != '' && env.PUBLISH != '1'
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/installer/*.exe
          if-no-files-found: error
      # GitHub Releases の作成（プレリリースまたは正式リリース）
      - if: env.PUBLISH == '1'
        run: |
          pre=
          if [[ $TAG == *-* ]]; then
            pre=--prerelease
          fi
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" $pre --generate-notes ${PREV:+--notes-start-tag "$PREV"}
        env:
          GH_TOKEN: ${{ github.token }}
      # リリースノート末尾へ不可視のビルド番号注釈（<!-- nyaw-build: <番号> -->）を付加
      - if: env.PUBLISH == '1'
        run: |
          build=$(git rev-list --count HEAD)
          gh release view "$TAG" --json body -q .body | sed '/^<!-- nyaw-build: [0-9]* -->$/d' > notes.md
          { echo; echo "<!-- nyaw-build: $build -->"; } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - if: env.PUBLISH == '1'
        run: gh release upload "$TAG" target/installer/*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
      # 正式リリース発行後、main ブランチを次期バージョン（-dev.0）へ自動進行させるため Prepare release をトリガー
      - if: github.event_name == 'push' && env.TAG != ''
        run: |
          v=${TAG#v}
          next=${v%%-*}
          [ "$v" != "$next" ] || next=${next%.*}.$((${next##*.} + 1))
          gh workflow run prepare-release.yml --ref main -f version="$next-dev.0"
        env:
          GH_TOKEN: ${{ github.token }}
