name: Release

# インストーラをビルドしてリリースに添付する。リリースは次のどちらか:
# - main で Cargo.toml の版を上げた push（版上げの PR をマージしたとき）。このジョブが v<版> のリリースを作る
#   （GITHUB_TOKEN で作ったリリースではワークフローが発火しないので、作るところから添付まで同じジョブでする）。
#   インストーラーは版上げの PR のチェックで作ったものをそのまま使う（使えないときはここでビルドし直す）。
#   版上げの PR は Actions の Prepare release（prepare-release.yml）で作れる。名前付きの版（2026.0.2-beta.1）もこれで出せる
# - 画面か自分の gh で公開したリリース（タグの commit をビルドした PR の run があれば、そのインストーラーを使う）
# それ以外の main の push はビルドだけして依存のキャッシュを保存する。タグや PR の run は main のキャッシュを読めるので、
# 依存をビルドし直さない（同じジョブなので rust-cache のキーも揃う）。リリース時にしか通らないビルドの失敗も先に分かる。
# 版を上げない PR では何もしない
on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Prepare release（prepare-release.yml）が版上げのブランチで起こす（GITHUB_TOKEN の push・PR では pull_request が来ない）
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    permissions:
      contents: write
      # PR の run のインストーラーを探して落とす
      actions: read
      pull-requests: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # PR はマージ用の commit ではなく PR の先頭をビルドする（main に入ったときと同じ中身・ビルド番号になるように）
          ref: ${{ github.event.pull_request.head.sha }}
          # 書き込めるトークンを .git に残さない（依存の build.rs から読めないように）
          persist-credentials: false
          # ビルド番号（HEAD までのコミット数。crates/updater/build.rs）を数えるので、履歴を全部取る
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # 出すタグを TAG に、ビルドするかを BUILD に置く。公開されたリリースならそのタグ。
      # それ以外は版が上がったときだけ v<新しい版>（main の push は直前と、PR とブランチの run は main から分かれた所と比べる）。
      # main の push は版を上げなくてもビルドする。
      # そのタグが別の commit に既にあれば版の上げ間違いなので止める（この commit を指していれば、やり直した run）。
      # ノートは前の版のタグからの差分（PREV。無ければ GitHub に任せる）
      - name: Decide the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before || 'origin/main' }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            echo "TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
            echo "BUILD=1" >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "BUILD=1" >> "$GITHUB_ENV"
          else
            BEFORE=$(git merge-base HEAD "$BEFORE")
          fi
          ver() { sed -n 's/^version = "\([^"]*\)".*/\1/p'; }
          new=$(ver < Cargo.toml)
          old=$(git show "$BEFORE:Cargo.toml" | ver) || true
          [ -n "$old" ] && [ "$new" != "$old" ] || exit 0
          at=$(git ls-remote --tags origin "refs/tags/v$new" | cut -f1)
          if [ -n "$at" ] && [ "$at" != "$(git rev-parse HEAD)" ]; then
            echo "::error::v$new is already tagged at $at"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$old" > /dev/null; then
            echo "PREV=v$old" >> "$GITHUB_ENV"
          fi
          echo "TAG=v$new" >> "$GITHUB_ENV"
          echo "BUILD=1" >> "$GITHUB_ENV"
      # タグは v<CalVer>[-<名前>.<数>]（v2026.0.1-beta.1。名前は何でもよいが、インストーラーのファイル名に入るので使えない文字は除く）。
      # 本体と nyapps（別のワークスペース）の全パッケージがタグの版か、その -<名前>.<数> を除いた版でなければビルド前に止める。
      # 表示する版はタグのもの（NYAW_VERSION）
      - name: Check tag matches Cargo.toml versions
        if: env.TAG != ''
        run: |
          set -o pipefail
          re='^v?[0-9]{4}\.[0-9]+\.[0-9]+(-[^<>:"|?*/\[:space:]]+\.[0-9]+)?$'
          if ! [[ "$TAG" =~ $re ]]; then
            echo "::error::tag $TAG is not v<CalVer>[-<label>.<number>] (e.g. v2026.0.1-beta.1)"
            exit 1
          fi
          pkgs=$(for m in Cargo.toml nyapps/Cargo.toml; do
            cargo metadata --manifest-path "$m" --no-deps --format-version 1 |
              grep -o '"name":"[^"]*","version":"[^"]*"'
          done)
          # 1 件も拾えないのは metadata の形が変わったとき。素通りさせない
          if [ -z "$pkgs" ]; then
            echo "::error::could not read package versions from cargo metadata"
            exit 1
          fi
          base=$(sed -E 's/-.+\.[0-9]+$//' <<<"${TAG#v}")
          bad=$(grep -v -e "\"version\":\"${TAG#v}\"" -e "\"version\":\"$base\"" <<<"$pkgs" || true)
          if [ -n "$bad" ]; then
            echo "::error::tag $TAG does not match these package versions: $bad"
            exit 1
          fi
          echo "NYAW_VERSION=${TAG#v}" >> "$GITHUB_ENV"
      # 版上げの PR（またはブランチ）のチェックで作ったインストーラーをそのまま出す。main の push では、マージした PR の先頭が
      # この commit と中身（ツリー）もビルド番号（コミット数）も同じときだけ使う（中身が同じならワークフローも同じなので、
      # PR の途中で書き換えたワークフローが作ったものも弾ける）。手で公開したリリースは、タグの commit そのものをビルドした run から。
      # PR が main の先頭の上に無いままマージした・ビルドが終わる前にマージした・版が違う・どこかで失敗した、のどれでも
      # BUILD が残り、この後でビルドし直す
      - name: Reuse the installer built in the PR
        if: (github.event_name == 'push' || github.event_name == 'release') && env.TAG != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" -q '.[0].number')
            git fetch -q origin "refs/pull/$pr/head"
            head=$(git rev-parse FETCH_HEAD)
            if [ "$(git rev-parse "$head^{tree}")" != "$(git rev-parse 'HEAD^{tree}')" ] ||
              [ "$(git rev-list --count "$head")" != "$(git rev-list --count HEAD)" ]; then
              echo "::notice::PR #$pr ($head) is not what landed on main; building again"
              exit 0
            fi
          fi
          run=$(gh run list -w release.yml -c "$head" -s success -L 1 --json databaseId -q '.[0].databaseId')
          gh run download "$run" -n installer -D pr-installer
          mkdir -p target/installer
          mv "pr-installer/nyaw-${TAG#v}-setup.exe" target/installer/
          echo "::notice::reusing the installer built by run $run for $head"
          echo "BUILD=" >> "$GITHUB_ENV"
      - if: env.BUILD == '1'
        uses: Swatinem/rust-cache@v2
        with:
          # 保存は main だけ（タグや PR のスコープに保存しても次の run からは読めない）
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # testing の build.rs（ライセンスの一覧）は `cargo metadata --offline` で開発用の依存まで読むので、全部落としておく
      # （`cargo build` はビルドに要るものしか落とさず、それを保存したキャッシュにも開発用の依存は無い）
      - if: env.BUILD == '1'
        run: cargo fetch --locked
      - if: env.BUILD == '1'
        run: cargo build --release
      # ランナーに Inno Setup が無いイメージでも動くように
      - if: env.BUILD == '1' && env.TAG != ''
        run: command -v iscc || choco install innosetup -y --no-progress
      - if: env.BUILD == '1' && env.TAG != ''
        run: iscc installer/nyaw.iss
      # 版上げの PR・ブランチでは作ったインストーラーを置いておく（マージ後の push がそのまま出す。落として試すこともできる）
      - if: github.event_name != 'push' && github.event_name != 'release' && env.TAG != ''
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: target/installer/*.exe
          if-no-files-found: error
      # 版上げの push は、インストーラーができてからリリースを作る（今までの版と同じくプレリリース。やり直しの run なら作らない）
      - if: github.event_name == 'push' && env.TAG != ''
        run: |
          gh release view "$TAG" > /dev/null 2>&1 ||
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --prerelease --generate-notes ${PREV:+--notes-start-tag "$PREV"}
        env:
          GH_TOKEN: ${{ github.token }}
      # アプリの更新は新旧をビルド番号（HEAD までのコミット数。crates/updater/build.rs と同じ数え方）で比べる。
      # 名前にも画面にも出さず、リリースノートの末尾に見えない注釈で残す（足し直すときは前のものを消す）
      - if: (github.event_name == 'push' || github.event_name == 'release') && env.TAG != ''
        run: |
          build=$(git rev-list --count HEAD)
          gh release view "$TAG" --json body -q .body | sed '/^<!-- nyaw-build: [0-9]* -->$/d' > notes.md
          { echo; echo "<!-- nyaw-build: $build -->"; } >> notes.md
          gh release edit "$TAG" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
      - if: (github.event_name == 'push' || github.event_name == 'release') && env.TAG != ''
        run: gh release upload "$TAG" target/installer/*.exe --clobber
        env:
          GH_TOKEN: ${{ github.token }}
