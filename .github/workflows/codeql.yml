name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # 依存や CodeQL のクエリが更新されるため、コードに変更がなくても週次で再解析する。
    - cron: "17 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: ./.github/workflows/changes.yml

  analyze:
    needs: changes
    # ドラフト状態の PR では実行をスキップ（ready_for_review 時に自動実行）
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Rust の解析は時間がかかるため、PR ではアプリに関係する変更があるときだけ行う（main と定期実行では常に行う）
        language: ${{ fromJSON((github.event_name != 'pull_request' || needs.changes.outputs.nyaw == 'true') && '["rust","actions","javascript-typescript"]' || '["actions","javascript-typescript"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # どの言語もビルドなしで解析できる。
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
