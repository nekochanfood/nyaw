name: nyaw Linux packages

# Linux の配布物（AppImage、tar.gz、deb、rpm、pkg.tar.zst）をビルドし、各ディストリビューションで起動を確認する。
# release.yml が呼び出す。配布物の構成（このファイルと apps/nyaw/installer/）や、更新時のインストール処理を変更した
# ブランチでは、push でも実行する。
on:
  workflow_call:
    inputs:
      version:
        description: 埋め込むバージョン（空欄の場合は Cargo.toml の値）
        type: string
        default: ''
      cache-only:
        description: ビルドキャッシュの作成のみを行い、配布物は作成しない
        type: boolean
        default: false
  push:
    branches-ignore: [main]
    paths:
      - .github/workflows/linux.yml
      - apps/nyaw/installer/**
      - apps/nyaw/crates/subsystems/update/**
      - apps/nyaw/crates/updater/**
      - apps/nyaw/src/**

env:
  CARGO_INCREMENTAL: '0'

jobs:
  # 各ディストリビューションの形式は、そのディストリビューションのコンテナでビルドする。ビルドした環境より古い glibc では
  # 起動できないため、AppImage、tar.gz、deb は配布先の下限とする Debian 12（glibc 2.36）でビルドする
  build:
    strategy:
      # 1 つの失敗で他のディストリビューションの結果が失われないようにする
      fail-fast: false
      matrix:
        include:
          - { distro: debian, container: 'debian:12', formats: appimage tar deb }
          - { distro: fedora, container: 'fedora:44', formats: rpm }
          - { distro: arch, container: 'archlinux:latest', formats: pacman }
    name: build (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    permissions:
      contents: read
    env:
      NYAW_VERSION: ${{ inputs.version }}
    defaults:
      run:
        shell: bash
        working-directory: apps/nyaw
    steps:
      # checkout が履歴を取得できるよう、先に git を導入する（git がないと履歴のないアーカイブを展開する）。
      # 開発パッケージの用途は ci.yml の LINUX_PACKAGES を参照。コンテナにはビルドの道具も含まれないため併せて導入する
      - name: Install the build dependencies (Debian)
        if: matrix.distro == 'debian'
        working-directory: /
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates cmake curl git pkg-config squashfs-tools unzip zsync \
            libasound2-dev libclang-dev libfontconfig1-dev libfreetype-dev libx11-dev libxkbcommon-dev
          # PipeWire の Rust のバインディングは、Debian 12 の 0.3.65 のヘッダーにない定数を参照するため、
          # 開発パッケージは backports から導入する。起動できる PipeWire の版は smoke ジョブで確認する
          echo 'deb http://deb.debian.org/debian bookworm-backports main' > /etc/apt/sources.list.d/backports.list
          apt-get update
          apt-get install -y --no-install-recommends -t bookworm-backports libpipewire-0.3-dev
      - name: Install the build dependencies (Fedora)
        if: matrix.distro == 'fedora'
        working-directory: /
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            binutils cmake curl gcc gcc-c++ git make pkgconf-pkg-config unzip \
            alsa-lib-devel clang-devel fontconfig-devel freetype-devel libX11-devel libxkbcommon-devel pipewire-devel
      - name: Install the build dependencies (Arch Linux)
        if: matrix.distro == 'arch'
        working-directory: /
        run: |
          pacman -Syu --noconfirm --needed \
            base-devel cmake curl git unzip \
            alsa-lib clang fontconfig freetype2 libx11 libxkbcommon pipewire
      - uses: actions/checkout@v4
        with:
          # 依存クレートの build.rs からトークンを遮断するため資格情報を破棄
          persist-credentials: false
          # ビルド番号（HEAD までの通算コミット数）を算出するため全履歴を取得
          fetch-depth: 0
      # コンテナのユーザーと作業ディレクトリの所有者が異なる。build.rs は git に失敗するとビルド番号を 0 にするため、
      # ここで git が動作することを確認する
      - run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "build number: $(git rev-list --count HEAD)"
      - uses: dtolnay/rust-toolchain@stable
      - id: cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/nyaw
          # ci.yml の ubuntu のジョブとはシステムのライブラリが異なるため、キャッシュを分ける
          prefix-key: v0-linux-packages-${{ matrix.distro }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ライセンス一覧生成のため、開発用依存パッケージを含む全ソースをオフラインビルド前に先行フェッチ
      - if: ${{ !inputs.cache-only || steps.cache.outputs.cache-hit != 'true' }}
        run: |
          cargo fetch --locked
          cargo build --release
      - if: ${{ !inputs.cache-only }}
        run: installer/linux.sh ${{ matrix.formats }}
      # 実行する環境に必要なライブラリと glibc の版をログに残す
      - if: ${{ !inputs.cache-only }}
        run: |
          readelf -d target/release/nyaw | grep NEEDED
          objdump -T target/release/nyaw | grep -oE 'GLIBC(XX)?_[0-9.]+' | sort -Vu | awk -F_ '{ v[$1] = $2 } END { for (k in v) print k, v[k] }'
      - if: ${{ !inputs.cache-only }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages-${{ matrix.distro }}${{ inputs.version && format('-{0}', inputs.version) }}
          path: apps/nyaw/target/installer/nyaw[-_]*
          if-no-files-found: error
          # 配布物は圧縮済み
          compression-level: 0

  # ビルドに使っていない環境に各形式を導入し、起動することを確認する（installer/smoke.sh）
  smoke:
    needs: build
    if: ${{ !inputs.cache-only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # FUSE でマウントして実行する
          - { target: appimage on ubuntu-24.04, format: appimage, distro: debian, container: '' }
          # 動作要件の下限（標準パッケージの PipeWire 0.3.65）。コンテナでは FUSE を使えないため、展開して実行する
          - { target: appimage on debian-12, format: appimage, distro: debian, container: 'debian:12' }
          - { target: tar.gz on ubuntu-24.04, format: tar, distro: debian, container: '' }
          - { target: deb on debian-12, format: deb, distro: debian, container: 'debian:12' }
          - { target: deb on ubuntu-24.04, format: deb, distro: debian, container: 'ubuntu:24.04' }
          - { target: rpm on fedora, format: rpm, distro: fedora, container: 'fedora:latest' }
          - { target: pkg.tar.zst on archlinux, format: pacman, distro: arch, container: 'archlinux:latest' }
    name: smoke (${{ matrix.target }})
    runs-on: ubuntu-latest
    container: ${{ matrix.container }}
    permissions:
      contents: read
    steps:
      # git のないコンテナでは、checkout はアーカイブを展開する（スクリプトだけを使うため履歴は不要）
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            apps/nyaw/installer
            apps/nyaw/crates/subsystems/update/src/linux
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages-${{ matrix.distro }}${{ inputs.version && format('-{0}', inputs.version) }}
          path: dist
      - run: bash apps/nyaw/installer/smoke.sh ${{ matrix.format }} dist
