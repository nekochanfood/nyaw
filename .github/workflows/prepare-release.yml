name: Prepare release

# リリース準備ワークフロー:
# 手動実行により指定バージョンのブランチ（release/v<バージョン>）を作成し、バージョン更新コミットと main 宛ての PR を発行する。
# 同時にインストーラービルドワークフロー（release.yml）をトリガーし、PR マージ時に生成済みインストーラーを正式リリースへ添付する。
#
# - 開発版（-dev.<番号>）の指定時は、リリースを発行せずバージョン更新のみをコミットして即時自動マージする。
# - プレリリース（alpha/beta 等）を発行する場合は、作成されたブランチに対して release.yml を手動実行する。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '新バージョン（<CalVer>[-<チャネル名>.<番号>]。例: 2026.0.3, 2026.0.3-beta.1。-dev.<番号> は main のバージョン進行のみ）'
        required: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release.yml をトリガーするための権限
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # リリースノート生成のために直近のタグを含む全履歴を取得
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      # バージョン番号の更新（Cargo.toml、AGENT.md、および Cargo.lock）
      - name: Bump the version
        env:
          NEW: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::run this on main"
            exit 1
          fi
          # SemVer 互換プレリリース識別子の形式検証（新旧判定はビルド番号で行うため文字の大小は問わない）
          if ! [[ "$NEW" =~ ^[0-9]{4}\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+\.[0-9]+)?$ ]]; then
            echo "::error::$NEW is not <CalVer>[-<label>.<number>] (e.g. 2026.0.3, 2026.0.3-beta.1)"
            exit 1
          fi
          old=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml)
          if [ "$NEW" = "$old" ]; then
            echo "::error::the version is already $old"
            exit 1
          fi
          if git ls-remote --exit-code origin "refs/tags/v$NEW" "refs/heads/release/v$NEW" > /dev/null; then
            echo "::error::v$NEW is already tagged or being prepared"
            exit 1
          fi
          sed -i "s/^version = \"$old\"/version = \"$NEW\"/" Cargo.toml
          sed -i "s/CalVer（現在 \`$old\`/CalVer（現在 \`$NEW\`/" AGENT.md
          cargo update --workspace
      - name: Open the release PR
        env:
          NEW: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "release/v$NEW"
          if [[ $NEW == *-dev.* ]]; then
            git commit -qam "chore: start $NEW" -m "[skip ci]"
            git push origin "release/v$NEW"
            gh pr create --base main --head "release/v$NEW" --title "chore: start $NEW" \
              --body "Moves main to $NEW after the release. Nothing is released; merged right away."
            gh pr merge "release/v$NEW" --rebase --delete-branch
            exit 0
          fi
          git commit -qam "chore(release): $NEW"
          git push origin "release/v$NEW"
          gh workflow run release.yml --ref "release/v$NEW"
          # 安定版は前の安定版からの変更履歴にする（release.yml と同じ規則）
          stable=()
          if [[ $NEW != *-* ]]; then
            stable=(--exclude '*-*')
          fi
          prev=$(git describe --tags --abbrev=0 "${stable[@]}" 2> /dev/null) || true
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$NEW" -f target_commitish="release/v$NEW" ${prev:+-f previous_tag_name="$prev"} -q .body)
          printf 'Merging this releases v%s with the installer built by the Release run on this branch.\n\n%s\n' "$NEW" "$notes" > body.md
          gh pr create --base main --head "release/v$NEW" --title "chore(release): $NEW" --body-file body.md
