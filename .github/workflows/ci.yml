name: CI

on: push

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # ブランチは main のキャッシュを読むだけ（ブランチごとに 1GB 超を保存すると 10GB の上限で main のが追い出される）
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: windows-latest
    env:
      # デバッグ情報（PDB）の生成とリンクがテストバイナリの数だけ効いて重いので切る。panic の位置は出る
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # 落ちた run でもキャッシュを残す（無いと毎回 25 分のフルビルドになる）
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # 調査用（一時）: キャッシュ完全一致なのに外部クレートが再ビルドされる理由と、クレートごとのビルド時間を見る。
      # CARGO_LOG はステップ env に置く（ジョブ env だと rust-cache のキー計算に入ってキャッシュが外れる）
      # -v で各クレートの Fresh / Dirty（再ビルド理由）が出る
      - run: cargo test --workspace --no-fail-fast --timings -v 2> fingerprint.log
        shell: bash
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-investigation
          path: |
            fingerprint.log
            target/cargo-timings/
