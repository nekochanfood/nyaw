name: CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  # インクリメンタルは CI では使い回さない
  CARGO_INCREMENTAL: "0"
  # audio の build.rs が Steam Audio の SDK（180MB）を落とさないように。テストは phonon を使わない
  NYAW_SKIP_PHONON: "1"

# sccache は使わない。依存は rust-cache の target で揃っていて、sccache に回るのは自前のクレートだけになる。
# clippy はそれを clippy-driver 経由で呼ぶのでキャッシュできない（multiple input files）。テストは Rust 1.100 の
# build-dir の新レイアウトで rustc に依存クレートごとの -L dependency= が付き、nyapp のコマンドラインが Windows の
# 上限（32767 文字）を超える。cargo は引数ファイル（@file）に逃がすが、sccache はそれを展開して os error 206 で落ちる。
# しかもブランチの run からも保存して 10GB の上限を食う

jobs:
  fmt:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # clippy は PR と main の push だけ（ブランチの push ごとには走らせない）
  clippy:
    # draft の PR では走らせない（ready_for_review で走る）
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft) || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # ブランチは main のキャッシュを読むだけ（ブランチごとに 1GB 超を保存すると 10GB の上限で main のが追い出される）
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    if: github.event_name == 'push'
    runs-on: windows-latest
    env:
      # デバッグ情報（PDB）の生成とリンクがテストバイナリの数だけ効いて重いので切る。panic の位置は出る
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # v0 はキャンセルされた run が途中までの target を保存し、以後キーが完全一致して上書きされず外部クレートを毎回ビルドしていた
          prefix-key: v1-rust
          # cache-on-failure は付けない。キャンセルされた run でも保存され、途中までの target がキャッシュになる。
          # テストが落ちた run も保存しないので、キーが変わった直後は main が通るまでフルビルドになる
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --no-fail-fast
