# zed の crates/gpui（rev 26363aab）の写し。ワークスペース継承を具体的な指定に展開してある。
# 変更点（NYAW: の印）:
# - `ContentMask` が角丸の切り抜き（`round` と `radii`）を持てる。`Styled::clip_rounded()` で、角丸の overflow を隠した要素が
#   中身をその角丸で切る（シェーダーで 1px ごとに端を削る。vendor/gpui_windows/src/shaders.hlsl）。
#   経路（Path）は角丸で切らない（四角形のまま）。
# zed を上げるときは、新しい版を写し直して NYAW: の箇所を当て直す。
[package]
name = "gpui"
version = "0.2.2"
authors = [
    "Nathan Sobo <nathan@zed.dev>",
]
description = "Zed's GPU-accelerated UI framework"
repository = "https://github.com/zed-industries/zed"
publish = false
license = "Apache-2.0"
homepage = "https://gpui.rs"
keywords = [
    "desktop",
    "gui",
    "immediate",
]
categories = [
    "gui",
]
edition = "2024"

[package.metadata.cargo-shear]
ignored = [
    "getrandom",
    "objc2",
    "objc2-metal",
]
ignored-paths = [
    "src/_ownership_and_data_flow.rs",
]

[features]
default = [
    "font-kit",
    "wayland",
    "x11",
    "windows-manifest",
]
test-support = [
    "collections/test-support",
    "http_client/test-support",
    "wayland",
    "x11",
    "proptest",
    "dep:futures-concurrency",
    "dep:postage",
    "dep:web-time",
]
bench-support = [
    "profiler",
    "dep:criterion",
    "dep:bench_metrics",
]
bench = [
    "bench-support",
]
inspector = [
    "gpui_macros/inspector",
]
leak-detection = []
font-kit = []
wayland = []
x11 = [
    "scap?/x11",
]
screen-capture = [
    "scap",
]
windows-manifest = [
    "dep:embed-resource",
]
profiler = [
    "dep:hdrhistogram",
]
stacker = [
    "dep:stacksafe",
]

[lib]
path = "src/gpui.rs"
doctest = false

[dependencies]
num_cpus = "1.13"
parking = "2.0.0"
ttf-parser = "0.25"
seahash = "4.1"
waker-fn = "1.2.0"
lyon = "1.0"
pin-project = "1.1.10"

[dependencies.accesskit]
version = "0.24.0"
features = [
    "enumn",
]

[dependencies.anyhow]
version = "1.0.86"

[dependencies.async-task]
version = "4.7"

[dependencies.backtrace]
version = "0.3"

[dependencies.bitflags]
version = "2.6.0"

[dependencies.collections]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.bench_metrics]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"
optional = true

[dependencies.criterion]
version = "0.8.2"
features = [
    "html_reports",
]
optional = true

[dependencies.ctor]
version = "1.0.12"

[dependencies.derive_more]
version = "2.1"
features = [
    "deref",
    "deref_mut",
    "from_str",
    "add",
    "add_assign",
    "mul",
    "mul_assign",
    "not",
]

[dependencies.etagere]
version = "0.2"

[dependencies.futures]
version = "0.3.34"

[dependencies.futures-concurrency]
version = "7.7.1"
optional = true

[dependencies.gpui_macros]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.gpui_shared_string]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.http_client]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.image]
version = "0.25.1"
default-features = false
features = [
    "bmp",
    "dds",
    "exr",
    "ff",
    "gif",
    "hdr",
    "ico",
    "jpeg",
    "png",
    "pnm",
    "qoi",
    "rayon",
    "tga",
    "tiff",
    "webp",
]

[dependencies.inventory]
version = "0.3.19"

[dependencies.itertools]
version = "0.14.0"

[dependencies.log]
version = "0.4"
default-features = false
features = [
    "std",
]

[dependencies.parking_lot]
version = "0.12.1"

[dependencies.postage]
version = "0.5"
default-features = false
features = [
    "blocking",
]
optional = true

[dependencies.proptest]
git = "https://github.com/proptest-rs/proptest"
rev = "3dca198a8fef1b32e3a66f1e1897c955b4dc5b5b"
features = [
    "attr-macro",
]
optional = true

[dependencies.chrono]
version = "0.4"
default-features = true
features = [
    "std",
    "serde",
]

[dependencies.profiling]
version = "1"

[dependencies.rand]
version = "0.9"
default-features = false
features = [
    "std",
    "std_rng",
    "os_rng",
    "small_rng",
    "thread_rng",
]

[dependencies.raw-window-handle]
version = "0.6"

[dependencies.regex]
version = "1.5"
default-features = true
features = [
    "std",
    "perf",
]

[dependencies.refineable]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.scheduler]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.resvg]
version = "0.46.0"
default-features = false
features = [
    "text",
    "system-fonts",
    "memmap-fonts",
    "raster-images",
]

[dependencies.usvg]
version = "0.46.0"
default-features = false

[dependencies.schemars]
version = "1.0"
default-features = false
features = [
    "std",
    "indexmap2",
    "derive",
]

[dependencies.serde]
version = "1.0"
features = [
    "rc",
    "derive",
]

[dependencies.serde_json]
version = "1.0.144"
features = [
    "preserve_order",
    "raw_value",
]

[dependencies.slotmap]
version = "1.0.6"

[dependencies.smallvec]
version = "1.6"
features = [
    "union",
    "const_new",
]

[dependencies.stacksafe]
version = "1.0"
optional = true

[dependencies.strum]
version = "0.28"
features = [
    "derive",
]

[dependencies.sum_tree]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.taffy]
version = "=0.13.0"
default-features = false
features = [
    "std",
    "taffy_tree",
    "flexbox",
    "grid",
    "block_layout",
    "float_layout",
    "content_size",
]

[dependencies.thiserror]
version = "2.0.12"

[dependencies.gpui_util]
git = "https://github.com/zed-industries/zed"
rev = "26363aabdb31a0c016728634202e1ad5067033aa"

[dependencies.hdrhistogram]
version = "7"
default-features = false
optional = true

[dependencies.spin]
version = "0.10"
default-features = false
features = [
    "mutex",
    "spin_mutex",
    "lock_api",
]

[dependencies.url]
version = "2.2"

[dependencies.uuid]
version = "1.1"
features = [
    "serde",
    "v4",
]

[dependencies.web-time]
version = "1.1.0"
optional = true

[dependencies.heapless]
version = "0.9.2"

[build-dependencies.embed-resource]
version = "3.0"
optional = true

[target."cfg(all(target_arch = \"wasm32\", target_os = \"unknown\"))".dependencies.async-channel]
version = "2.5"
default-features = false

[target."cfg(not(all(target_arch = \"wasm32\", target_os = \"unknown\")))".dependencies.async-channel]
version = "2.5"
default-features = false
features = [
    "std",
]

[target."cfg(not(target_family = \"wasm\"))".dependencies.pollster]
version = "0.4.0"

[target."cfg(target_family = \"wasm\")".dependencies.getrandom]
version = "0.3.4"
features = [
    "wasm_js",
]

[target."cfg(target_family = \"wasm\")".dependencies.uuid]
version = "1.1"
features = [
    "serde",
    "js",
]

[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies.objc2-core-foundation]
version = "=0.3.2"
default-features = false

[target."cfg(any(target_os = \"macos\", target_os = \"ios\"))".dependencies.objc2-core-video]
version = "=0.3.2"
default-features = false
features = [
    "CVBuffer",
    "CVImageBuffer",
    "CVPixelBuffer",
]

[target."cfg(target_os = \"macos\")".dependencies.log]
version = "0.4"
default-features = false
features = [
    "std",
]

[target."cfg(target_os = \"macos\")".dependencies.objc2]
version = "0.6"
optional = true

[target."cfg(target_os = \"macos\")".dependencies.objc2-metal]
version = "0.3"
optional = true

[target."cfg(any(target_os = \"linux\", target_os = \"freebsd\", target_os = \"windows\"))".dependencies.scap]
git = "https://github.com/zed-industries/scap"
rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac"
default-features = false
package = "zed-scap"
version = "0.0.8-zed"
optional = true

[target."cfg(any(target_os = \"linux\", target_os = \"android\"))".dependencies.libc]
version = "0.2"

[target."cfg(target_os = \"windows\")".dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Power",
    "Win32_System_RemoteDesktop",
    "Win32_System_WindowsProgramming",
]
